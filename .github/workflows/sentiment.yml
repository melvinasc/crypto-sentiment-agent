name: Crypto Sentiment Agent

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sentiment agent
        run: python main.py --max 15 --save-json --save-markdown

      - name: Copy report to docs
        run: mkdir -p docs && cp outputs/report.json docs/report.json

      - name: Push to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/report.json
          git commit -m "update report.json" || echo "nothing to commit"
          git push
