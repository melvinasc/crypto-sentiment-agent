name: Crypto Sentiment Agent

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sentiment agent
        run: python main.py --max 15 --save-json --save-markdown

      - name: Copy report to docs folder
        run: |
          mkdir -p docs
          cp outputs/report.json docs/report.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/report.json
          git diff --cached --quiet || git commit -m "chore: update report.json [skip ci]"
          git push

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentiment-report-${{ github.run_number }}
          path: outputs/
          retention-days: 30
